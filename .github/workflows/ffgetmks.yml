name: ffgetmks()
on:
  workflow_dispatch:
    inputs:
      ifsrc:
        required: true
        type: string
      of:
        required: true
        type: string
      ifref:
        required: false
        type: string
      ifparam:
        required: false
        type: string
      ofparam:
        required: false
        type: string

permissions:
  contents: read

jobs:
  run-job:
    name: ${{ inputs.of }}
    runs-on: ubuntu-latest

    env:
      IF_SRC:   ${{ inputs.ifsrc }}
      IF_REF:   ${{ inputs.ifref }}
      OF:       ${{ inputs.of }}
      IF_PARAM: ${{ inputs.ifparam }}
      OF_PARAM: ${{ inputs.ofparam }}

    steps:
      - name: depends()
        shell: bash
        run: |
          set -euo pipefail


          URL_RE='^https?://([^@/?#[:space:]]*@)?(\[[0-9A-Fa-f:.]+\]|[A-Za-z0-9._~-]+)(:[0-9]+)?(/[^?#[:space:]]*)?(\?[^#[:space:]]*)?(#[^[:space:]]*)?$'
          MAGNET_RE='^magnet:\?xt=urn:btih:([A-Za-z0-9]+)(&[^[:space:]]*)?$'
          if [[ "$IF_SRC" =~ $URL_RE ]]; then
            : is http/https url
          elif [[ "$IF_SRC" =~ $MAGNET_RE ]]; then
            HASH="${BASH_REMATCH[1]}"

            if [[ ${#HASH} -eq 32 ]]; then

              HEX="$(python3 -c "
                  import base64
                  import sys
                  h = sys.argv[1].upper()
                  pad = (8 - len(h) % 8) % 8
                  h += '=' * pad
                  decoded = base64.b32decode(h)
                  assert len(decoded) == 20, 'decoded length mismatch'
                  print(decoded.hex())
                  " "$HASH")"

              if [[ $? -ne 0 || -z "$HEX" ]]; then
                echo "::error::failed to convert Base32 btih to Hex, got: '$HASH'"
                exit 1
              fi

              IF_SRC="$(python3 -c "
                  import sys, re
                  src, old, new = sys.argv[1], sys.argv[2], sys.argv[3]
                  src = re.sub(r'xt=urn:btih:' + re.escape(old), 'xt=urn:btih:' + new, src)
                  print(src)
                  " "$IF_SRC" "$HASH" "$HEX")"
              echo "IF_SRC=$IF_SRC" >> "$GITHUB_ENV"

            elif [[ ${#HASH} -eq 40 ]]; then
              : "btih is Hex (40 chars), no conversion needed"
            else
              echo "::error::unsupported btih length: ${#HASH} (expected 32 or 40), got: '$HASH'"
              exit 1
            fi
          else
            echo "::error::ifsrc must be a legal http(s) URL or magnet URI, got: '$IF_SRC'"
            exit 1
          fi


          # --- of: single filename; leading './' components tolerated ---
          name="$OF"
          while [[ "$name" == ./* ]]; do
            name="${name#./}"
          done
          if [[ -z "$name" || "$name" == "." || "$name" == ".." || "$name" == */* ]]; then
            echo "::error::of must be a single filename with no directory component and not '.' or '..', got: '$OF'"
            exit 1
          fi
          if ! [[ "$(printf '%s' "$name" | wc -c)" -le 255 ]]; then
            echo "::error::of exceeds Linux NAME_MAX (255 bytes)"
            exit 1
          fi

          # --- install deps ---
          if [ -d /etc/apt/sources.list.d ]; then
            find /etc/apt/sources.list.d -maxdepth 1 -type f \
              ! -name '*.disabled' \
              \( -name '*microsoft*' -o -name '*azure*' -o -name '*github*' \
                 -o -name '*vscode*' -o -name '*google-chrome*' \
                 -o -name '*nodesource*' -o -name '*yarn*' \) \
              -exec sudo mv '{}' '{}'.disabled \;
          fi
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get -qq -o APT::Progress-Fancy=0 update >/dev/null
          sudo apt-get -qq -o APT::Progress-Fancy=0 \
            -o Dpkg::Progress-Fancy=0 \
            -o Dpkg::Use-Pty=0 \
            install -y --no-install-recommends \
            -- ffmpeg >/dev/null

          git clone --depth 1 --single-branch --no-tags "https://github.com/flosnvjx/scriptbase" scriptbase
          echo "${{ github.workspace }}/scriptbase" >> "$GITHUB_PATH"
          mkdir -p runtime-data

      - name: package()
        working-directory: runtime-data
        shell: bash
        run: |
          set -euo pipefail

          IF_ARGS=()
          OF_ARGS=()

          [[ -n "$IF_PARAM" ]] && mapfile -d '' -t IF_ARGS < <(python3 -c 'import shlex,sys; for a in shlex.split(sys.argv[1]): sys.stdout.write(a + "\0")' "$IF_PARAM")
          [[ -n "$OF_PARAM" ]] && mapfile -d '' -t OF_ARGS < <(python3 -c 'import shlex,sys; for a in shlex.split(sys.argv[1]): sys.stdout.write(a + "\0")' "$OF_PARAM")

          [[ -n "$IF_REF" ]] && IF_ARGS+=(-referer "$IF_REF")

          ffgetmks --verbose \
            -nostats \
            "${IF_ARGS[@]}" \
            -i "$IF_SRC" \
            "${OF_ARGS[@]}" \
            "$OF"

      - name: push()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.of }}
          path: 'runtime-data/**/*'
          retention-days: 7
